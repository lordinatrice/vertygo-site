{%- assign s = include.t.day -%}
<section id="day" class="section" aria-labelledby="day-title">
  <div class="container stack stack--lg">
    <div class="section-head">
      <h2 id="day-title" class="display display--xl text-pink">{{ s.title }}</h2>
      <p class="script script--md text-green">{{ s.subtitle }}</p>
    </div>
    <ol class="day" role="list">
      {%- for moment in s.moments %}
      <li class="day__card day__card--{{ moment.theme }}">
        <span class="day__time">{{ moment.time }}</span>
        <div>
          <h3 class="display display--card">{{ moment.title }}</h3>
          <p>{{ moment.body }}</p>
        </div>
      </li>
      {%- endfor %}
    </ol>
  </div>
</section>
