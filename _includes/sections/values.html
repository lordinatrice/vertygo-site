{%- assign s = include.t.values -%}
<section class="band" aria-label="{{ s.label }}">
  <ul class="band__list" role="list">
    {%- for word in s.words %}
      {% unless forloop.first %}<li class="band__star" aria-hidden="true">✦</li>{% endunless %}
      <li>{{ word }}</li>
    {%- endfor %}
  </ul>
</section>
