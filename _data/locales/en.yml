values:
  label: "Our values"
  words: [ "free", "bold", "skilled", "together" ]

community:
  title: "Come for<br>the aerials,"
  subtitle: "stay for the community."
  body: "Expert teachers, a small group, and real progress whatever your level. Beginners are carried by the group, experienced flyers are pushed further. Everyone leaves stronger, and with new friends."
  photos:
    studio: "Hoops hanging in a bright aerial studio"
    group: "A group practising on aerial hammocks outdoors"

day:
  title: "a day<br>up there"
  subtitle: "fly in the morning, wander after."
  moments:
    - time: "Morning"
      title: "aerial · 1h30"
      body: "Technique and flow on your main apparatus."
      theme: plum
    - time: "Midday"
      title: "discovery · 1h30"
      body: "Contortion, straps, hammock or yoga with a guest teacher."
      theme: green
    - time: "Afternoon"
      title: "out there"
      body: "Hikes, river swims, markets, or open practice."
      theme: blue
    - time: "Evening"
      title: "together"
      body: "Shared dinners, sunsets and stories."
      theme: pink

beyond:
  title: "Beyond<br>the studio"
  subtitle: "a retreat is also a journey."
