  description: "A week of aerial arts with expert teachers, in small groups, between the studio and wide-open landscapes."
  skip_link: "Skip to content"

header:
  home: "Vertygo Aerial, back to top"
  cta: "Join the list"

footer:
  instagram: "Instagram @vertygo.aerial"

hero:
  eyebrow: "Aerial retreats · small groups · all levels"
  fly: "fly"
  upside_down: "upside down"
  where: "somewhere sunny."
  lead: "A week of aerial arts with expert teachers, in small groups, between the studio and wide-open landscapes."
  cta: "Shape your dream retreat"
